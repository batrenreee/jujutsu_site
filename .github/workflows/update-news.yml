name: JJK haber akışını güncelle

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jjk-news
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Haber akışını yenile
        run: npm run news:update

      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet -- data/live-news.json; then
            echo "Yeni haber yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-news.json
          git commit -m "chore: refresh JJK news feed"
          git push
